name: Extended Quality

on:
    workflow_dispatch:
    schedule:
        - cron: '0 2 * * *'

jobs:
    extended:
        runs-on: ubuntu-latest
        env:
            VITE_API_MODE: mock
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.12.3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: pnpm --filter @miaoma-doc/web exec playwright install --with-deps chromium

            - name: Run extended gate
              run: pnpm gate:extended
